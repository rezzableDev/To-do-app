spring.application.name=todo_app

# Подключение к PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/todo_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки Hibernate (отключаем сырой вывод SQL-кода)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.default-chat-id=${TELEGRAM_BOT_DEFAULT_CHAT_ID:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:TaskingFlow_bot}

# Use a unique random value of at least 32 characters in Render. It signs access tokens.
app.jwt.secret=${JWT_SECRET:change-me-in-render-with-a-random-32-byte-secret}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:10080}

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
